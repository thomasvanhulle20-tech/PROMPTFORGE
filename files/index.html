<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowPrompt — Maîtrise l'IA et génère des revenus en ligne</title>
    <meta name="description" content="Apprends à utiliser l'IA pour créer des revenus en ligne">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #ffffff;
            color: #1f2937;
            line-height: 1.7;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* Navigation */
        .navbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #4f46e5;
        }
        .nav-menu a {
            margin: 0 18px;
            text-decoration: none;
            color: #374151;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 12px 28px;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 600;
        }

        /* Hero */
        .hero {
            padding: 120px 0 100px;
            text-align: center;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 24px;
        }
        .gradient-text {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-subtitle {
            font-size: 1.35rem;
            max-width: 720px;
            margin: 0 auto 40px;
            color: #4b5563;
        }

        /* Sections */
        .section {
            padding: 90px 0;
        }
        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 60px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        /* Générateur */
        .generator-card {
            max-width: 820px;
            margin: 40px auto;
            background: white;
            border: 2px solid #e0e7ff;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.12);
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1.1rem;
            margin-bottom: 25px;
            resize: vertical;
        }
        .btn-generate {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 18px 40px;
            font-size: 1.15rem;
            font-weight: 600;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            width: 100%;
        }

        .result-area {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-content">
            <div class="nav-logo">FlowPrompt</div>
            <div class="nav-menu">
                <a href="#generateur">Générateur gratuit</a>
                <a href="#packs">Packs</a>
                <a href="/blog.html">Blog</a>
                <a href="/a-propos.html">À propos</a>
            </div>
            <a href="#packs" class="btn-primary">Voir les packs</a>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>Maîtrise l’IA.<br><span class="gradient-text">Génère des revenus.</span></h1>
            <p class="hero-subtitle">Guides gratuits, générateur de prompts et packs de prompts testés sur le terrain.</p>
            <a href="#generateur" class="btn-primary" style="font-size:1.3rem; padding:18px 50px;">Essayer le générateur gratuit</a>
        </div>
    </header>

    <section id="generateur" class="section">
        <div class="container">
            <h2 class="section-title">Générateur de prompt professionnel</h2>
            <div class="generator-card">
                <textarea id="prompt-input" placeholder="Décris ce que tu veux faire (ex: créer des posts TikTok, rédiger un ebook, etc.)"></textarea>
                <button onclick="genererPrompt()" class="btn-generate">✦ Générer mon prompt professionnel</button>
                <div id="result" class="result-area"></div>
            </div>
        </div>
    </section>

    <script>
        function genererPrompt() {
            const input = document.getElementById('prompt-input').value.trim();
            const result = document.getElementById('result');
            if (!input) {
                result.innerHTML = "<p style='color:#ef4444'>Veuillez décrire ce que vous voulez faire.</p>";
                return;
            }
            result.innerHTML = `<strong>Prompt généré :</strong><br><br>${input}<br><br><em>Tu es un expert en IA. Réponds de façon claire, structurée et directement exploitable.</em>`;
        }
    </script>
</body>
</html>
