<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlowPrompt</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #111, #000);
  color:white;
}

.container {
  max-width:420px;
  margin:auto;
  padding:20px;
}

h1 {
  font-size:26px;
  font-weight:800;
  line-height:1.3;
}

.gradient {
  background: linear-gradient(90deg,#a855f7,#6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.card {
  background: #0f0f0f;
  padding:20px;
  border-radius:16px;
  margin-top:25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

textarea {
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  background:#000;
  color:white;
  margin-top:10px;
}

.ai-buttons {
  display:flex;
  gap:8px;
  margin-top:15px;
}

.ai {
  flex:1;
  padding:10px;
  text-align:center;
  border-radius:10px;
  background:#1a1a1a;
  cursor:pointer;
  font-size:13px;
}

.ai.active {
  background: linear-gradient(90deg,#a855f7,#6366f1);
}

.button {
  width:100%;
  padding:16px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background: linear-gradient(90deg,#a855f7,#6366f1);
  color:white;
  font-weight:600;
  font-size:16px;
}

.result {
  margin-top:15px;
  background:#000;
  padding:15px;
  border-radius:12px;
  font-size:14px;
  white-space:pre-wrap;
}

.copy {
  background:#222;
}

.cta {
  display:block;
  text-align:center;
  margin-top:25px;
  padding:16px;
  border-radius:12px;
  background:gold;
  color:black;
  font-weight:700;
  text-decoration:none;
}

.small {
  font-size:12px;
  color:#888;
  margin-top:15px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>
Gagne de l’argent avec l’IA grâce à des <span class="gradient">prompts optimisés</span>
</h1>

<div class="card">

<p>Décris ton besoin :</p>

<textarea id="input" placeholder="Ex : trouve 10 idées de business rentables..."></textarea>

<p>Choisis ton IA :</p>

<div class="ai-buttons">
  <div class="ai active" onclick="selectAI(this)">ChatGPT</div>
  <div class="ai" onclick="selectAI(this)">Claude</div>
  <div class="ai" onclick="selectAI(this)">Gemini</div>
  <div class="ai" onclick="selectAI(this)">Grok</div>
</div>

<button class="button" onclick="generatePrompt()">Générer mon prompt</button>

<div id="result" class="result"></div>

<button class="button copy" onclick="copyPrompt()">Copier le prompt</button>

</div>

<a href="/pack" class="cta">Accéder au pack complet</a>

<p class="small">Support disponible – réponse sous 24h</p>

</div>

<script>
let selectedAI = "ChatGPT";

function selectAI(el){
  document.querySelectorAll('.ai').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  selectedAI = el.innerText;
}

function generatePrompt(){
  let input = document.getElementById("input").value;

  if(!input){
    alert("Ajoute une demande");
    return;
  }

  let prompt = `Agis comme un expert en ${selectedAI}.

${input}

Donne une réponse claire, structurée et exploitable immédiatement.`;

  document.getElementById("result").innerText = prompt;
}

function copyPrompt(){
  let text = document.getElementById("result").innerText;
  navigator.clipboard.writeText(text);
  alert("Prompt copié !");
}
</script>

</body>
</html>
